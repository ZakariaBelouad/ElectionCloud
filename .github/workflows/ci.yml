name: CI

# Runs on a clean checkout with public dependencies and synthetic data only.
# No cloud credentials, no secrets, and no dependency on any teammate's PC.
# Local equivalents for every step are listed in infra/ops/README.md.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-cosmos.txt -r requirements-kafka.txt ruff cfn-lint
      - name: Repository hygiene (no databases, keys, env files or credentials tracked)
        run: python tests/integration/check_repo_hygiene.py
      - name: Lint (syntax errors and undefined names)
        run: ruff check --select E9,F .
      - name: Byte-compile all sources
        run: python -m compileall -q .
      - name: Unit and integration tests
        run: python -m unittest discover -s tests -t . -v
      - name: Verify Oracle standby and fallback
        run: |
          python infra/aws/test_tally.py
          python infra/oci/test_recovery.py
      - name: Validate the CloudFormation templates
        # W3002: the Lambda code path only resolves with `aws cloudformation package`.
        run: cfn-lint infra/ops/template.yaml infra/ops/test-webhook.yaml -i W3002

  docker:
    name: Docker build and synthetic vote
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build both image targets
        run: |
          docker build --target web -t electioncloud-web:ci .
          docker build --target worker -t electioncloud-worker:ci .
      - name: Validate Compose file
        run: docker compose config --quiet
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Synthetic vote end to end (unique Compose project, cleaned up afterwards)
        run: python tests/integration/smoke_compose.py --project "ec-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --evidence smoke-evidence.json
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-evidence
          path: smoke-evidence.json
          if-no-files-found: ignore
      - name: Make sure nothing from the test project is left behind
        if: always()
        run: |
          docker compose -p "ec-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" down -v --remove-orphans || true
