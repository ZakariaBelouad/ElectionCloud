name: electioncloud

x-storage-environment: &storage-environment
  - ELECTIONCLOUD_STORAGE
  - ELECTIONCLOUD_ELECTION_ID
  - COSMOS_ENDPOINT
  - COSMOS_AUTH
  - AZURE_CLIENT_ID
  - COSMOS_KEY
  - COSMOS_DATABASE
  - COSMOS_CONTAINER

services:
  broker:
    image: apache/kafka:4.4.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes:
      - broker_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "broker:9092", "--list"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s

  web:
    image: electioncloud-web:local
    build:
      context: .
      target: web
    command: ["python", "web.py", "--db", "/data/election.db", "--bind", "0.0.0.0", "--port", "${ELECTIONCLOUD_PORT:-8767}", "--kafka"]
    environment: *storage-environment
    ports:
      - "127.0.0.1:${ELECTIONCLOUD_PORT:-8767}:${ELECTIONCLOUD_PORT:-8767}"
    volumes:
      - election_data:/data
    depends_on:
      broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${ELECTIONCLOUD_PORT:-8767}/', timeout=3).close()"]
      interval: 5s
      timeout: 4s
      retries: 5

  worker:
    build:
      context: .
      target: worker
    command: ["python", "kafka_worker.py", "--db", "/data/election.db", "--broker", "${ELECTIONCLOUD_BROKER:-broker:9092}"]
    environment: *storage-environment
    volumes:
      - election_data:/data
    depends_on:
      broker:
        condition: service_healthy
    restart: on-failure

  admin:
    profiles: ["admin"]
    image: electioncloud-web:local
    entrypoint: ["python", "electioncloud.py", "--db", "/data/election.db"]
    environment: *storage-environment
    volumes:
      - election_data:/data
      - tally_keys:/keys

volumes:
  broker_data:
  election_data:
  tally_keys:
